<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灵狐降灵 · 矢量演出</title><style>*{box-sizing:border-box}body{margin:0;background:#211f24;color:#f5e2c0;font:15px system-ui;display:flex;justify-content:center;gap:28px;padding:20px}canvas{height:min(90vh,850px);aspect-ratio:720/1005;border:1px solid #d7a85b}aside{width:300px}h1{font-size:24px}button{background:#47342f;color:#fff5df;border:1px solid #d7a85b;padding:10px;cursor:pointer;margin:4px}input{width:100%}p{line-height:1.7}a{color:#d7a85b}@media(max-width:800px){body{display:block;padding:12px}canvas{width:100%;height:auto}aside{width:auto}}</style><canvas width="720" height="1005"></canvas><aside><h1>灵狐降灵 · 绘卷法衣</h1><p>起势 → 灵狐钻出 → 绕身一圈 → 卷带成衣 → 守护定格</p><button id="play">播放 / 暂停</button><button id="replay">重播</button><input id="time" type="range" min="0" max="3" step=".005"><p id="phase"></p><div id="frames"></div><p>同一组矢量路径在这里由 Canvas 2D 绘制，在游戏里由 Path 分层绘制。尾巴连续形变为披帛、腰环与画卷衣摆。</p><button id="svg">导出当前矢量帧</button><p><a href="/?lab=1&qa=1&arrow=1">进入游戏预览</a></p></aside><script type="module">import {drawGuardianCanvas,guardianSceneSvg} from '/src/rendering/fox-vestment-scene.ts';import {guardianTimeline} from '/src/gameplay/fox-guardian.ts';const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),slider=document.querySelector('#time'),label=document.querySelector('#phase');let t=2.16,playing=false,last=performance.now();function draw(){drawGuardianCanvas(ctx,t,720,1005);slider.value=t;label.textContent=['起势','灵狐钻出','绕身盘旋','法衣成形','守护定格','收招'][guardianTimeline(t).phase]+' · '+t.toFixed(3)+' s';}document.querySelector('#play').onclick=()=>playing=!playing;document.querySelector('#replay').onclick=()=>{t=0;playing=true;};slider.oninput=()=>{t=Number(slider.value);playing=false;draw();};for(const [name,time] of [['起势',.22],['钻出',.69],['盘旋',1.14],['法衣定格',2.16]]){const b=document.createElement('button');b.textContent=name;b.onclick=()=>{t=time;playing=false;draw();};document.querySelector('#frames').append(b);}document.querySelector('#svg').onclick=()=>{const url=URL.createObjectURL(new Blob([guardianSceneSvg(t)],{type:'image/svg+xml'})),a=document.createElement('a');a.href=url;a.download='fox-guardian-'+t.toFixed(2)+'.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};function frame(now){if(playing){t=Math.min(2.399,t+(now-last)/1000);if(t>=2.399)playing=false;}last=now;draw();requestAnimationFrame(frame);}window.__GUARDIAN_CANVAS__={frame:time=>{t=time;playing=false;draw();}};requestAnimationFrame(frame);</script></html>
